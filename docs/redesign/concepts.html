<div class="review-bar"><strong>FLIGHT DECK / DESIGN STUDY</strong><label for="concept" class="label">Concept</label><select id="concept" aria-label="Choose concept"></select><span class="review-note">ILLUSTRATIVE DATA · NO LIVE CONTROLS</span></div>
<div class="frame">
<header class="top"><div class="brand">LIVE <b>DESKTOP</b></div><div class="status"><i class="dot"></i> Local services available</div><button data-view="lifecycle">Restart</button><button data-view="lifecycle" class="red">Shut down</button><button data-view="settings">Settings</button><button data-view="profiles">Local user / Profile</button></header>
<div class="page-heading"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="stamp">DESIGN EXPLORATION / 15 OCT 2026<br>PC OVERVIEW FIRST</div></div>
<main id="content" class="workspace"></main>
<div class="composer"><span>ASSISTANT</span><p>Ask about your PC, files, or current work.</p><button data-view="conversations">Open conversation</button></div>
<nav id="dock" class="dock" aria-label="Dashboard concept navigation"></nav>
<footer class="footer"><span>LOCAL PROFILE / Local user</span><span>FRONTEND + BACKEND / AVAILABLE <span class="mint">●</span></span><span>MOCK READINGS / NOT YOUR PC</span></footer>
<aside id="notes" class="notes" aria-label="Concept rationale"></aside>
</div><div id="feedback" class="demo-feedback" role="status"></div>
<script>
const paths={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',system:'M3 4h18v13H3z M8 21h8 M12 17v4',music:'M9 18V5l11-2v13 M9 8l11-2 M9 18a3 3 0 1 1-3-3c1 0 2 .3 3 1 M20 16a3 3 0 1 1-3-3c1 0 2 .3 3 1',approvals:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',memories:'M6 3h12v18l-6-4-6 4z',conversations:'M3 4h18v13H9l-6 4z M7 9h10 M7 13h6',settings:'M4 7h16 M4 17h16 M8 4v6 M16 14v6',play:'M8 4l12 8-12 8z',pause:'M8 4v16 M16 4v16',next:'M5 4l12 8-12 8z M20 4v16',prev:'M19 4L7 12l12 8z M4 4v16',arrow:'M5 19L19 5 M7 5h12v12'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.system}"/></svg>`;
const btn=(text,cls='',view='',name='')=>{const autoName=['play','pause','prev','next'].find(n=>text===icon(n));const labels={play:'Play',pause:'Pause',prev:'Previous track',next:'Next track'};return `<button class="${cls}" ${name||autoName?`aria-label="${name||labels[autoName]}"`:''} ${view?`data-view="${view}"`:'data-demo'}>${text}</button>`};
const section=(name,action='',view='')=>`<div class="section-heading"><span>${name}</span>${action?btn(action,'',view):''}</div>`;
const line=(pct)=>`<div class="line"><i style="width:${pct}%"></i></div>`;
const data=(name,value)=>`<div class="data-row"><span>${name}</span><span>${value}</span></div>`;
const row=(title,detail,tail='')=>`<div class="list-row"><div class="grow"><strong>${title}</strong><small>${detail}</small></div>${tail}</div>`;
const gauge=(name,value,pct,detail)=>`<div class="gauge" style="--progress:${pct*2.89}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/><circle class="arc" cx="50" cy="50" r="46"/></svg><div class="gauge-copy"><div class="label">${name}</div><strong class="value">${value}<span>%</span></strong><small>${detail}</small></div></div>`;
const phone=`<svg viewBox="0 0 100 190" fill="none" aria-label="Neutral phone schematic" role="img"><rect x="8" y="3" width="84" height="184" rx="14" stroke="#9aabbc" stroke-width="1.5"/><rect x="14" y="10" width="72" height="169" rx="9" fill="#0f1b28"/><path d="M39 16h22 M39 171h22" stroke="#829bb5" stroke-width="3"/><path d="M32 88l12 12 26-28" stroke="#4a9aff" stroke-width="2"/></svg>`;
const pc=`<svg viewBox="0 0 300 220" fill="none" role="img" aria-label="Schematic of this PC"><rect x="24" y="26" width="198" height="127" rx="3" stroke="#a5b6c6" stroke-width="1.5"/><rect x="30" y="32" width="186" height="114" fill="#0b1420"/><path d="M104 154v24h40v-24 M78 181h91" stroke="#7e91a4" stroke-width="1.5"/><rect x="239" y="43" width="46" height="138" rx="3" stroke="#91a5b8" stroke-width="1.5"/><circle cx="262" cy="56" r="3" stroke="#4a9aff"/><path d="M250 146h24 M250 153h24 M250 160h24" stroke="#526c87"/><rect x="110" y="75" width="28" height="28" stroke="#4a9aff"/><path d="M118 68v7 M130 68v7 M118 103v7 M130 103v7 M103 83h7 M103 95h7 M138 83h7 M138 95h7 M30 89h67 M151 89h65" stroke="#3d668e"/><path d="M24 199h261" stroke="#263340"/></svg>`;
const art=`<div class="art" role="img" aria-label="Placeholder album artwork">${icon('music')}</div>`;
const controls=()=>section('System controls')+[['Wi-Fi','Home network','ON','on'],['Bluetooth','Available','ON','on'],['Focus','Windows Settings','OPEN','shortcut'],['Night light','Windows Settings','OPEN','shortcut'],['Mic privacy','Windows Settings','OPEN','shortcut'],['Battery saver','Windows Settings','OPEN','shortcut']].map(([n,d,b,c])=>`<div class="control"><div><strong>${n}</strong><small>${d}</small></div>${btn(b,c)}</div>`).join('')+`<p class="legend">ON / OFF controls act in Live Desktop.<br>OPEN launches Windows Settings externally.</p>${btn('1 action needs approval<br>Review requested access','inline-notice','approvals')}`;
const home=()=>`<div class="overview"><section class="left-rail">${controls()}</section><section class="center"><div class="gauges">${gauge('CPU load',24,24,'Current utilization')}${gauge('Memory used',58,58,'18.6 / 32 GB')}${gauge('Storage used',42,42,'420 GB / 1 TB')}</div><div class="pc-stage"><div class="readout"><span class="label">Network</span><strong class="blue">Connected</strong><small>Home network</small></div>${pc}<div class="readout"><span class="label">Power</span><strong>AC connected</strong><small>No battery reported</small></div></div><div class="device-caption"><strong>LOCAL-DESKTOP</strong><small>Windows 11 · x64 · <button class="linklike" data-view="system">System details</button></small></div><div class="connections">${section('Connections')}<div class="connection-grid"><div><span>Local backend</span><span class="mint">Available</span></div><div><span>OpenAI key</span><span>Configured</span></div><div><span>iCloud Calendar</span><span class="mint">Connected</span></div><div><span>Music session</span><span class="mint">Available</span></div></div></div></section><aside class="right-rail"><section class="side-block">${section('Today / iCloud','Day view','calendar')}${row('Design review','Work calendar · 30 min','<time>14:00</time>')}${row('Project work','Personal calendar · 60 min','<time>16:30</time>')}</section><section class="side-block">${section('Phone Link','Details','phone')}<div class="phone-mini">${phone}<div><h3>Linked phone</h3><small class="mint">Connected</small><small style="display:block">Battery 82% · checked now</small></div></div>${line(82)}<small>Private messages stay in Phone Link.</small></section><section class="side-block">${section('Music','Full player','music')}<div class="mini-player">${art}<div><strong>Example track</strong><small>Example artist</small></div>${btn(icon('pause'),'')}</div>${line(38)}<small class="mono">1:24 / 3:42 · Apple Music</small></section></aside></div><div style="margin-top:28px">${section('Recent activity','All apps','activity')}<div class="connection-grid">${row('Visual Studio Code','Running app · window available')}${row('Microsoft Edge','Running app · window available')}</div></div>`;
const system=()=>`<div class="two-col"><section><div class="metrics-horizontal">${[['CPU',24,'Current utilization'],['Memory',58,'18.6 / 32 GB'],['Storage',42,'580 GB free']].map(([n,v,d])=>`<div class="resource-flat"><span class="label">${n}</span><strong class="value">${v}<small>%</small></strong>${line(v)}<small>${d}</small></div>`).join('')}</div><div class="specs"><section>${section('Device specifications')}${data('Device name','LOCAL-DESKTOP')}${data('Processor','Reported processor name')}${data('Cores / logical processors','8 / 16')}${data('Installed RAM','32 GB')}${data('Graphics','Reported adapter')}${data('Architecture','x64')}</section><section>${section('Windows specifications')}${data('Edition','Windows 11')}${data('Version / build','Reported by Windows')}${data('Installed on','Reported install date')}${data('Device ID','Available in copy details')}${data('Product ID','Available in copy details')}</section></div><div class="button-row">${btn('Copy system details','primary')}${btn('Refresh readings')}</div></section><aside class="detail">${pc}<h2>About this PC</h2><p>Hardware identity and live resources share one readable equipment sheet.</p><div class="rule"></div>${data('Network','Connected')}${data('Power','AC connected')}${data('Backend','Available')}${data('OpenAI key','Configured')}<p class="view-note">Current values only. No fabricated history, temperature, bandwidth, or health diagnosis.</p></aside></div>`;
const approvals=()=>`<div class="three-col"><aside><div class="tablist"><span class="selected">Pending / 1</span><span>History</span></div><div class="selection-list">${btn('<strong>Turn off Wi-Fi</strong><small>Awaiting approval · just now</small>','selected')}${btn('<strong>Open Phone Link</strong><small>Completed · 10 min ago</small>')}${btn('<strong>Save a memory</strong><small>Rejected · yesterday</small>')}</div></aside><section class="detail"><span class="tag warn">AWAITING APPROVAL</span><h2>Allow turning off Wi-Fi?</h2><p>The assistant requested this action after your message. Turning Wi-Fi off may interrupt this PC’s network connection.</p><div class="approval-scope">${data('Action','Turn off Wi-Fi')}${data('Target','Wi-Fi radio')}${data('Profile','Local user')}<p class="amber">This authorizes this profile to turn Wi-Fi off or on in future without another prompt. The permission remains approved even if this attempt fails.</p></div><div class="button-row">${btn('Reject request')}${btn('Approve capability','primary')}</div><p class="view-note">Show submitting while the request is in flight, then the backend result: approved, completed, failed, or rejected. Approval is not proof of completion.</p></section><aside class="context-rail">${section('Approval scope')}<p class="muted" style="font-size:13px">Show the exact request and the scope the backend will remember before the user commits.</p><div class="rule"></div><h3>One action at a time</h3><p class="view-note">No bulk approval, automatic retry, or new permission model is implied by this design.</p></aside></div>`;
const memories=()=>`<div class="two-col"><section>${section('Stored memories')}<div class="tablist"><span class="selected">All / 3</span><span>Preference</span><span>Project</span><span>Fact</span><span>Instruction</span></div>${row('Use concise explanations','PREFERENCE · Local user',btn('Delete','danger'))}${row('Working on the dashboard redesign','PROJECT · Local user',btn('Delete','danger'))}${row('Ask before publishing changes','INSTRUCTION · Local user',btn('Delete','danger'))}<p class="view-note">Sample memories for layout only. Category filtering is a proposed client-side enhancement.</p></section><aside class="detail"><h2>Add a memory</h2><p>Keep something useful for future conversations.</p><div class="account-form"><label>Memory</label><div class="field">Remember a preference or project detail</div><label>Category</label><div class="field">Preference</div></div>${btn('Add memory','primary')}<div class="rule"></div><p>Stored on this PC in the current profile. Every saved memory stays inspectable and removable.</p><p class="view-note">If saving fails, preserve the draft and show the error beside this form.</p></aside></div>`;
const conversations=()=>`<div class="three-col"><aside>${btn('New conversation','wide')}<div class="selection-list">${btn('<strong>Check my PC</strong><small>4 messages</small>','selected')}${btn('<strong>Plan the afternoon</strong><small>6 messages</small>')}${btn('<strong>Dashboard ideas</strong><small>8 messages</small>')}</div></aside><section><div class="section-heading">Check my PC <span class="label">Local history</span></div><div class="chat-message"><span class="label">You</span><p>What is using memory right now?</p></div><div class="chat-message"><span class="label blue">Live Desktop</span><p>The current system reading shows 18.6 GB of 32 GB in use. Open System Info to inspect the available resource details.</p><p>I don’t have a per-process memory breakdown in this view.</p>${btn('Open System Info','','system')}</div><div class="chat-input"><span>Message your assistant</span>${btn('Send','primary')}</div><p class="view-note">Concept transcript. Sending uses the configured OpenAI service; conversation history is saved locally.</p></section><aside class="context-rail">${section('Current context')}${data('Active profile','Local user')}${data('API key','Configured')}${data('Pending actions','1')}${btn('Review approval','inline-notice','approvals')}<p class="view-note">This summary uses existing profile and queue state. Linking an individual request to a message requires a verified action association.</p></aside></div>`;
const music=()=>`<div class="two-col"><section><div class="large-player">${art}<div><span class="label">Apple Music / Windows media</span><h2>Example track</h2><p class="muted">Example artist · Example album</p>${line(38)}<small class="mono">1:24 / 3:42</small><div class="playback">${btn(icon('prev'))}${btn(icon('pause'),'primary')}${btn(icon('next'))}${btn('Shuffle')}${btn('Mute')}</div></div></div><div class="embed"><div><h2>Selected provider player</h2><p>Apple Music or Spotify appears here using its own web player. Its internal appearance remains provider controlled.</p><span class="tag">EMBED PLACEHOLDER</span><p>Login and initial playback happen inside the actual provider player.</p></div></div></section><aside>${section('Playback status')}${data('Provider','Apple Music')}${data('Media session','Available')}${data('Now playing','Example track')}${data('Metadata','Windows media session')}<div class="rule"></div><h3>Your player stays mounted</h3><p class="view-note">Navigation should not interrupt playback. Switching providers intentionally replaces the selected embed.</p><div class="button-row">${btn('Music settings','','settings')}${btn('Open provider externally')}</div><p class="view-note">No speculative queue, equalizer, volume slider, or fabricated waveform. Keep the controls the integration actually supports.</p></aside></div>`;
const settings=()=>`<div class="two-col"><div class="settings-list"><section>${section('OpenAI / Current profile','Configured')}<p>Used for assistant requests. Credentials are protected on this PC and never returned after saving.</p><div class="account-form"><label>API key</label><div class="field">Profile key saved · enter a replacement</div></div><div class="button-row">${btn('Replace key','primary')}${btn('Remove key','danger')}</div></section><section>${section('iCloud Calendar','Connected')}<p>Use an Apple app-specific password. Never enter the regular Apple Account password.</p><div class="account-form"><label>Apple Account email</label><div class="field">example@icloud.com</div><label>App-specific password</label><div class="field">Not displayed after saving</div></div><div class="button-row">${btn('Connect calendar')}${btn('Disconnect','danger')}</div></section><section>${section('Music service')}<div class="button-row">${btn('Apple Music','on')}${btn('Spotify')}</div><div class="account-form"><label>Album or playlist link</label><div class="field">Paste a shared provider link</div></div><div class="button-row">${btn('Connect link','primary')}${btn('Refresh media status')}${btn('Disconnect link','danger')}</div><p class="view-note">Provider links remain separate. Sign in within the selected provider player; developer credentials are not required.</p></section></div><aside class="detail"><h2>Appearance</h2><p>Flight Deck keeps black surfaces, precise dividers, and an accent reserved for interaction.</p><div class="button-row">${btn('Dark','on')}${btn('Light')}</div><div class="rule"></div><h3>Accent</h3><div class="swatches">${['#4a9aff','#85d9bd','#ffc56d','#ff8589','#b9a0ff','#ffffff'].map(c=>`<span class="swatch" style="--swatch:${c}"></span>`).join('')}</div><div class="account-form"><label>Custom hex color</label><div class="field mono">#4A9AFF</div></div>${btn('Apply accent')}<p class="view-note">Keep existing presets, custom hex, light mode, and per-profile persistence. Warning/error colors remain semantic.</p><div class="rule"></div><h3>Local user</h3><p class="view-note">Connections and preferences belong to this profile.</p><div class="button-row">${btn('Manage profiles','','profiles')}</div></aside></div>`;
const calendar=()=>`<div class="two-col"><section><div class="week"><span>MON<br>12</span><span>TUE<br>13</span><span>WED<br>14</span><span class="selected">THU<br>15</span><span>FRI<br>16</span><span>SAT<br>17</span><span>SUN<br>18</span></div><div class="calendar-grid"><time>13:00</time><div class="event"><small>No scheduled events</small></div><time>14:00</time><div class="event busy"><strong>Design review</strong><small>14:00–14:30 · Work calendar · Studio</small></div><time>15:00</time><div class="event"><small>No scheduled events</small></div><time>16:30</time><div class="event busy"><strong>Project work</strong><small>16:30–17:30 · Personal calendar</small></div><time>ALL DAY</time><div class="event"><strong>Example all-day event</strong><small>Personal calendar</small></div></div><div class="button-row">${btn('Previous day')}${btn('Today','primary')}${btn('Next day')}${btn('Refresh')}</div></section><aside class="detail"><h2>Today at a glance</h2><p>The home module stays compact. Expanding it gives events more room without moving account management out of Settings.</p>${data('Source','iCloud Calendar')}${data('Selected date','October 15, 2026')}${data('Timezone','Local time')}${data('Connection','Connected')}<div class="button-row">${btn('Calendar settings','','settings')}</div><p class="view-note">Proposed expanded day panel, not a new calendar product. Editing, invitations, and event creation are outside the current scope.</p></aside></div>`;
const phoneView=()=>`<div class="two-col"><section><div class="phone-hero">${phone}<div><h2>Linked phone</h2><span class="tag good">CONNECTED</span><p style="margin-top:17px">Device name and platform come from Phone Link.<br>Neutral silhouette shown in this concept.</p></div></div><div class="metrics-horizontal"><div class="resource-flat"><span class="label">Battery</span><strong class="value">82<small>%</small></strong>${line(82)}</div><div class="resource-flat"><span class="label">Last sync</span><strong style="font-size:22px">Just now</strong><small>Local metadata</small></div><div class="resource-flat"><span class="label">Notification signal</span><strong style="font-size:22px">Available</strong><small>No private content shown</small></div></div><div class="button-row">${btn('Refresh','primary')}${btn('Copy device')}${btn('Open Phone Link externally')}</div></section><aside class="detail"><h2>Device details</h2>${data('Name','Linked phone')}${data('Platform','Reported platform')}${data('Model','Reported model')}${data('Last seen','Reported timestamp')}<div class="rule"></div><p>Use the iPhone or Android illustration only when the reported platform is known. Keep a neutral placeholder otherwise.</p><p class="view-note">This is the expanded home panel. Calls, messages, and private notifications remain in the external Windows app.</p></aside></div>`;
const profiles=()=>`<div class="two-col"><section>${section('Profiles on this PC')}<div class="selection-list">${btn('<strong>Local user</strong><small>Current profile</small>','selected')}${btn('<strong>Work</strong><small>Switch profile</small>')}${btn('<strong>Personal</strong><small>Switch profile</small>')}</div><div class="button-row">${btn('New profile','primary')}</div><p class="view-note">In the application, this layout becomes a right-side panel opened from the top-bar profile control. It occupies the full width on narrow screens.</p></section><aside class="detail"><div class="profile-avatar">LU</div><h2>Local user</h2><div class="account-form"><label>Profile name</label><div class="field">Local user</div></div><div class="button-row">${btn('Change photo')}${btn('Save name','primary')}</div><div class="rule"></div><p>Theme, accent, conversations, memories, approvals, API key, and integration configuration stay scoped to this local profile.</p><p class="view-note">Switching reloads the app with the selected profile. Local profiles are organization, not separate authenticated accounts.</p><div class="button-row"><button disabled>Default profile cannot be deleted</button></div></aside></div>`;
const activity=()=>`<div class="two-col"><section>${section('Running applications')}<div class="tablist"><span class="selected">Detected apps</span><span>Window availability</span></div>${row('Visual Studio Code','Source editor · detected locally','<span class="tag good">RUNNING</span>')}${row('Microsoft Edge','Browser · detected locally','<span class="tag good">RUNNING</span>')}${row('File Explorer','Files · detected locally','<span class="tag good">RUNNING</span>')}<div class="button-row">${btn('Show fewer')}</div></section><aside class="detail"><h2>Activity without clutter</h2><p>A quiet table replaces a stack of decorative app cards. App names, available window details, and observed state are the content.</p><p class="view-note">Concept for the home module’s expanded list. “Recent activity” currently draws from detected applications; do not invent a usage timeline or launch controls.</p></aside></div>`;
const lifecycle=()=>`<div class="two-col"><section><div class="lifecycle-panel"><span class="tag warn">CONFIRM SHUTDOWN</span><h2 style="margin-top:20px">Shut down Live Desktop?</h2><p>This stops Live Desktop’s frontend and backend. It does not shut down Windows.</p><p style="margin-top:15px">After shutdown, this page cannot restart the services. Open Live Desktop using start.cmd to return.</p><div class="button-row">${btn('Cancel','','home')}${btn('Shut down both','danger')}</div></div></section><aside><div class="state-example"><span class="tag">RESTARTING</span><h3>Restarting local services</h3><p>The dashboard reconnects and reloads when both services are ready. Keep the restart control unavailable while this is in progress.</p></div><div class="state-example"><span class="tag warn">RECONNECTION FAILED</span><h3>Services did not become ready</h3><p>Keep the failure visible and offer status refresh. Do not display a successful restart based on elapsed time.</p>${btn('Check status')}</div><div class="state-example"><span class="tag">SERVICES OFF</span><h3>Live Desktop is stopped</h3><p>Explain how to relaunch from start.cmd. Never present an in-page start button that cannot work.</p></div></aside></div>`;
const states=()=>`<div class="state-grid">${[
['LOADING','Waiting for system data','CPU — · Memory — · Storage —. Keep the instrument frames stable, but show no fill or invented zero.',''],
['STALE','Calendar could not refresh','Keep the last events visible with their last successful update time. Other modules stay usable.','Retry calendar'],
['EMPTY','No events on this day','The calendar is connected and the selected day is empty. This is different from a connection failure.','Choose another day'],
['DISCONNECTED','Connect iCloud Calendar','Explain the missing connection and send the user directly to its Settings section.','Open Settings'],
['PENDING','Turning Wi-Fi off…','Keep the last confirmed state, disable repeated submissions, then apply the confirmed action result.',''],
['FAILED','Wi-Fi change did not complete','Show the error and refreshed actual state. Do not replay a mutation automatically.','Refresh status'],
['UNAVAILABLE','Battery not reported','Show AC power only when supported by the reported power state. Missing battery data is not 0%.',''],
['NO KEY','Set up your assistant','Keep the PC dashboard useful. Explain that the assistant requires an OpenAI API key for this profile.','Open Settings']
].map(([s,t,d,b])=>`<section class="state-example"><span class="tag ${['STALE','FAILED'].includes(s)?'warn':''}">${s}</span><h3>${t}</h3><p>${d}</p>${b?btn(b,'',b==='Open Settings'?'settings':''):''}</section>`).join('')}</div>`;
const design=()=>`<div class="token-grid">${[['Void','#000000'],['Instrument','#090c10'],['Divider','#303943'],['Signal','#4a9aff'],['Ready','#85d9bd'],['Attention','#ffc56d']].map(([n,c])=>`<div><div class="token" style="--swatch:${c}"></div><strong>${n}</strong><small class="mono">${c.toUpperCase()}</small></div>`).join('')}</div><div class="two-col"><section><h2>Precision over decoration</h2><div class="sample-type">SYSTEM OVERVIEW</div><p class="muted">Bahnschrift for instrument headings. Segoe UI for longer text. Tabular numerals for measured values. Use sentence case for task copy and uppercase only for short headings.</p><div class="rule"></div><div class="button-row">${btn('Primary action','primary')}${btn('Secondary action')}${btn('External settings '+icon('arrow'))}${btn('Destructive action','danger')}</div></section><aside><h2>Shape and spacing</h2>${data('Surface','True black, subtle raised panels')}${data('Corners','0–4 px; circles for instruments')}${data('Spacing scale','4 / 8 / 12 / 16 / 24 / 32 / 48')}${data('Body text target','14–16 px in production')}${data('Motion','120–180 ms; reduced-motion support')}${data('Accent rule','Interaction and quantitative fills')}<p class="view-note">Use real units, readable labels, icon + text states, and visible keyboard focus. No decorative radar, glowing grid, animated star field, or spaceship illustration.</p></aside></div>`;
const views={
home:['System overview','The whole PC, understood at a glance.',home,['Instrument-centered overview','Three honest resource gauges anchor the composition. A small PC schematic replaces the reference’s spacecraft; system identity stays secondary to readings.','Peripheral controls','System actions occupy the left rail. Calendar, phone, and music form a service rail. Recent apps sit beneath; the assistant stays one click away.','Review decision','Recommended baseline: black instrumentation, blue signals, bottom dock. Values are sample content. Desktop and narrow layouts are both part of this study.']],
system:['System Info','A precise equipment sheet for the computer you are using.',system,['Readable specifications','Use aligned definition rows, copyable details, and current resource bars. Long identifiers wrap rather than breaking the grid.','Truthful telemetry','No graphs without sampled history. No temperature, per-process usage, or throughput without a real source.','Preserved functions','Device details, Windows details, live system status, copy action, and refresh remain discoverable.']],
music:['Music','One compact player language, from overview to full view.',music,['Playback first','Current artwork, real metadata, progress, and supported playback commands retain the existing compact player anatomy.','Provider boundary','Style the player’s surrounding frame. The third-party embed keeps its provider UI, authentication, and playback constraints.','Continuity','Mount the chosen embed once on first Music visit. Keep it alive through ordinary navigation and replace only when the provider or link changes.']],
approvals:['Approvals','Make the action and remembered permission unambiguous.',approvals,['Request → scope → decision','A queue on the left and focused details in the center support careful review without burying the requested action.','Amber means attention','Reserve amber for pending decisions and warnings. Approval, execution, completion, and failure remain different states.','Backend authority','Scope text must derive from the real action payload and capability policy. Do not invent approve-once or revoke controls that the backend does not support.']],
memories:['Memories','A readable, inspectable record of what the assistant remembers.',memories,['Record layout','Text and category lead. A quiet list uses space more effectively than a wall of equally weighted cards.','Preserve the draft','Creation, category selection, and deletion stay explicit. A failed save leaves the entered content intact.','Optional enhancement','Category filters operate over the existing list. Editing, bulk deletion, versioning, and search are not assumed capabilities.']],
conversations:['Conversations','A calm communications workspace within the same instrument shell.',conversations,['Readable conversation','Use a thread rail and wide, restrained transcript. Longer text is sentence case with a comfortable measure.','Context without noise','Profile, configuration, and pending actions sit beside the conversation. Approval opens the dedicated review view.','Privacy wording','History is stored locally. OpenAI requests are external; avoid language suggesting that model inference happens entirely on this PC.']],
settings:['Settings','Connections and appearance, organized by purpose.',settings,['Connection forms','OpenAI, iCloud, and music each get distinct configuration and error states. Credentials stay masked and are not read back after saving.','Appearance continuity','Retain per-profile light/dark, presets, custom hex, and the Black-accent contrast behavior. Default direction remains true black and blue.','State variants','Connected panels show status and disconnect; disconnected panels show setup. This study exposes the form anatomy together for review.']],
calendar:['Calendar / expanded day','A closer look at the calendar module, with familiar day navigation.',calendar,['Existing data, clearer space','Use event time, title, duration, calendar, and location. All-day events stay separate from timed entries.','Expansion, not a new route','The proposed day panel expands the home module. Account setup remains in Settings.','Edge cases','Support an empty day, overlapping events, timezone boundaries, slow loading, stale results, and disconnected iCloud.']],
phone:['Phone Link / expanded panel','Connection status without inventing access to private phone content.',phoneView,['Device-specific visual','Use known iOS or Android artwork; a neutral silhouette handles unknown platform. The reference’s central hardware motif becomes useful here.','Useful quick actions','Refresh, copy device, details, and an explicitly external Phone Link action remain visible.','Honest metadata','Battery and timestamps can be absent. Display a notification availability signal only when the backend reports it; do not fabricate notification bodies.']],
profiles:['Local profiles','A compact account panel with clear local boundaries.',profiles,['Panel, not new destination','The top-bar trigger opens a focused profile panel. Show identity, switch targets, name, photo, create, and eligible delete controls.','Isolated state','Preserve current reload-on-switch behavior and per-profile persistence. Prevent data from an old profile flashing into a new one.','Existing safeguards','Keep the default/last profile protected. Local profiles are not authenticated accounts or Windows-user security boundaries.']],
activity:['Recent activity / expanded list','A quiet inventory of detected applications.',activity,['Preserved content','App identity, observed process/window details, and show-more behavior remain available in the Home module.','Source honesty','Detected applications are not a historical usage feed. Do not imply last-used timestamps or productivity scoring without a source.','Composition','A compact list on Home expands vertically when needed. This board isolates that component for review; no new primary navigation is proposed.']],
lifecycle:['Runtime controls','Keep restart, shutdown, and recovery understandable.',lifecycle,['Visible controls','Keep restart and shutdown in the top bar on every view. They manage Live Desktop, not the Windows machine.','Protected decision','The shutdown dialog names both services and explains the inability to restart from a stopped backend. Focus returns to the trigger on cancel.','Readiness evidence','Restart feedback follows real service readiness. Show reconnect failure and relaunch instructions instead of timing-based success.']],
states:['Loading, errors & empty states','The same visual language must hold when things are not ready.',states,['Per-resource feedback','A slow calendar does not block local PC information. Last-known values can remain visible with explicit staleness.','No fabricated health','Unknown is a dash and explanation, not a zero, green indicator, or false success.','Accessible state','Use labels and shapes in addition to color. Announce meaningful action outcomes without reading every polling update aloud.']],
design:['Design system','A reference-derived visual language for all dashboard surfaces.',design,['From the supplied reference','Black field, white typography, blue arcs, thin structure, compact labels, equipment-centered overview, and a lower navigation dock.','Adapted for everyday use','Increase contrast and body type, preserve familiar task names, isolate destructive controls, and give forms and conversations room to breathe.','Draft, not a locked theme','Tokens and components are proposals for this concept pass. Light-mode parity, font availability, and responsive fit remain production validation gates.']]
};
const nav=[['home','Overview'],['system','System Info'],['music','Music'],['approvals','Approvals'],['memories','Memories'],['conversations','Conversations'],['settings','Settings']];
const select=document.querySelector('#concept');
for(const [id,v] of Object.entries(views)){const option=document.createElement('option');option.value=id;option.textContent=v[0];select.append(option)}
function render(id){if(!views[id])id='home';const [title,sub,body,notes]=views[id];document.querySelector('#title').textContent=title;document.querySelector('#subtitle').textContent=sub;document.querySelector('#content').innerHTML=body();document.querySelector('#notes').innerHTML=[0,2,4].map(i=>`<div><h3>${notes[i]}</h3><p>${notes[i+1]}</p></div>`).join('');document.querySelector('#dock').innerHTML=nav.map(([key,label])=>`<button data-view="${key}" class="${key===id?'active':''}" ${key===id?'aria-current="page"':''}>${icon(key)}<span>${label}</span></button>`).join('');select.value=id;history.replaceState(null,'','#'+id)}
const renderView=render;render=id=>{renderView(id);document.querySelector('.composer').hidden=id==='conversations'};
select.addEventListener('change',e=>render(e.target.value));
let noticeTimer;
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view){render(button.dataset.view);document.querySelector('#title').setAttribute('tabindex','-1');document.querySelector('#title').focus();window.scrollTo({top:0,behavior:'instant'})}else if(button.hasAttribute('data-demo')){const feedback=document.querySelector('#feedback');feedback.textContent='Concept only. This control does not change your PC, credentials, or saved data.';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>feedback.textContent='',4500)}});
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));render(location.hash.slice(1)||'home');
</script>
