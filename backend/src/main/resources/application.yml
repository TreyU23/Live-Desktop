server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:4317}

spring:
  application:
    name: local-assistant-os
  config:
    import: optional:file:${LIVE_DESKTOP_ROOT:..}/.env[.properties]

assistant:
  data-dir: ${DATA_DIR:../data}
  workspace-root: ${WORKSPACE_ROOT:..}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_MODEL:gpt-6.2-sol}
  reasoning-effort: ${OPENAI_REASONING_EFFORT:medium}
  anthropic-api-key: ${ANTHROPIC_API_KEY:}
  anthropic-model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  anthropic-effort: ${ANTHROPIC_EFFORT:medium}
  provider: ${ASSISTANT_PROVIDER:openai}
